name: MusicDesk

on:
  push:
    branches: ["**"]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "GitHub-Release v<Version aus Info.plist> erstellen"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build (Universal)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Build
        run: ./scripts/build.sh

      - name: Verify architectures
        run: |
          archs="$(lipo -archs dist/MusicDesk.app/Contents/MacOS/MusicDesk)"
          echo "Architectures: $archs"
          [[ " $archs " == *" arm64 "* ]] || { echo "arm64 missing"; exit 1; }
          [[ " $archs " == *" x86_64 "* ]] || { echo "x86_64 missing"; exit 1; }

      - name: Verify signature
        run: |
          codesign -dv --verbose=2 dist/MusicDesk.app
          codesign --verify --deep --strict --verbose=2 dist/MusicDesk.app

      - name: Show Info.plist
        run: plutil -p dist/MusicDesk.app/Contents/Info.plist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicDesk
          path: dist/MusicDesk-*.zip
          if-no-files-found: error

      - name: Release name
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        id: rel
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=MusicDesk $tag" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.rel.outputs.name }}
          files: dist/MusicDesk-*.zip
