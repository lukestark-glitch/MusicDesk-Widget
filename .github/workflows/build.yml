name: MusicDesk

on:
  push:
    branches: ["**"]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "GitHub-Release v<Version aus Info.plist> erstellen"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build (Universal, Xcode ${{ matrix.xcode }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both jobs run on the Intel macOS 15 image: it has plenty of capacity
        # (arm64 macos-15/macos-26 jobs were repeatedly cancelled for lack of
        # runners) and ships Xcode 16.x as well as Xcode 26.x.
        # - Xcode 16.4: compile check with an older SDK/compiler (the
        #   `#if compiler(>=6.2)` Liquid Glass branch is skipped).
        # - Xcode 26.3: newest SDK, compiles Liquid Glass – only this job
        #   uploads the artifact and publishes releases.
        include:
          - os: macos-15-intel
            xcode: "16.4"
            publish: false
          - os: macos-15-intel
            xcode: "26.3"
            publish: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode ${{ matrix.xcode }}
        run: |
          ls -d /Applications/Xcode*.app || true
          xcode="/Applications/Xcode_${{ matrix.xcode }}.app"
          if [[ ! -d "$xcode" ]]; then
            # Fall back to the newest installed Xcode with the same major version.
            major="${{ matrix.xcode }}"; major="${major%%.*}"
            xcode="$(find /Applications -maxdepth 1 -name "Xcode_${major}*.app" | sort -V | tail -n 1)"
          fi
          [[ -n "$xcode" && -d "$xcode" ]] || { echo "Xcode ${{ matrix.xcode }} nicht gefunden"; exit 1; }
          echo "Using $xcode"
          sudo xcode-select -s "$xcode/Contents/Developer"

      - name: Require Swift 6.2+ for the release build (Liquid Glass)
        if: matrix.publish
        run: |
          v="$(swift --version 2>&1 | sed -nE 's/.*Swift version ([0-9]+\.[0-9]+).*/\1/p' | head -n 1)"
          echo "Swift $v"
          [[ "$(printf '%s\n6.2\n' "$v" | sort -V | head -n 1)" == "6.2" ]] || { echo "Swift >= 6.2 benötigt (ist $v)"; exit 1; }

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version
          cmake --version || echo "cmake missing (build.sh installs it via Homebrew)"

      - name: Build
        run: ./scripts/build.sh

      - name: Verify architectures
        run: |
          archs="$(lipo -archs dist/MusicDesk.app/Contents/MacOS/MusicDesk)"
          echo "Architectures: $archs"
          [[ " $archs " == *" arm64 "* ]] || { echo "arm64 missing"; exit 1; }
          [[ " $archs " == *" x86_64 "* ]] || { echo "x86_64 missing"; exit 1; }

      - name: Verify signature
        run: |
          codesign -dv --verbose=2 dist/MusicDesk.app
          codesign --verify --deep --strict --verbose=2 dist/MusicDesk.app

      - name: Show Info.plist
        run: plutil -p dist/MusicDesk.app/Contents/Info.plist

      - name: Adapter-Test
        continue-on-error: true
        timeout-minutes: 2
        run: |
          app="$PWD/dist/MusicDesk.app/Contents"
          set +e
          /usr/bin/perl "$app/Resources/mediaremote-adapter.pl" \
            "$app/Frameworks/MediaRemoteAdapter.framework" \
            "$app/Helpers/MediaRemoteAdapterTestClient" test
          code=$?
          set -e
          echo "Adapter-Test exit code: $code (0 = funktionsfähig; auf CI-Runnern ohne Medien oft != 0)"
          echo "Adapter-Test (Xcode ${{ matrix.xcode }}): Exit-Code $code" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        if: matrix.publish
        uses: actions/upload-artifact@v4
        with:
          name: MusicDesk
          path: dist/MusicDesk-*.zip
          if-no-files-found: error

      - name: Release name
        if: matrix.publish && (startsWith(github.ref, 'refs/tags/v') || inputs.release)
        id: rel
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=MusicDesk $tag" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: matrix.publish && (startsWith(github.ref, 'refs/tags/v') || inputs.release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.rel.outputs.name }}
          files: dist/MusicDesk-*.zip
