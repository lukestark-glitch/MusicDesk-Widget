name: MusicDesk

on:
  push:
    branches: ["**"]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "GitHub-Release v<Version aus Info.plist> erstellen"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build (Universal, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel: Intel runner, Xcode 16 / macOS-15-SDK (compile check
        #   without the macOS 26 SDK – the `#if compiler(>=6.2)` branch is skipped).
        # macos-26: newest Xcode/SDK – only this runner publishes artifacts/releases.
        # (macos-14 was retired by GitHub; arm64 macos-15 often lacks capacity.)
        os: [macos-15-intel, macos-26]
    env:
      RELEASE_RUNNER: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest Xcode
        if: matrix.os == 'macos-26'
        run: |
          ls /Applications | grep Xcode || true
          xcode="$(ls -d /Applications/Xcode*.app 2>/dev/null | grep -vi beta | sort -V | tail -n 1 || true)"
          if [[ -z "$xcode" ]]; then
            xcode="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          fi
          if [[ -n "$xcode" ]]; then
            echo "Using $xcode"
            sudo xcode-select -s "$xcode/Contents/Developer"
          else
            echo "No Xcode found in /Applications, keeping default"
          fi

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version
          cmake --version || echo "cmake missing (build.sh installs it via Homebrew)"

      - name: Build
        run: ./scripts/build.sh

      - name: Verify architectures
        run: |
          archs="$(lipo -archs dist/MusicDesk.app/Contents/MacOS/MusicDesk)"
          echo "Architectures: $archs"
          [[ " $archs " == *" arm64 "* ]] || { echo "arm64 missing"; exit 1; }
          [[ " $archs " == *" x86_64 "* ]] || { echo "x86_64 missing"; exit 1; }

      - name: Verify signature
        run: |
          codesign -dv --verbose=2 dist/MusicDesk.app
          codesign --verify --deep --strict --verbose=2 dist/MusicDesk.app

      - name: Show Info.plist
        run: plutil -p dist/MusicDesk.app/Contents/Info.plist

      - name: Adapter-Test
        continue-on-error: true
        timeout-minutes: 2
        run: |
          app="$PWD/dist/MusicDesk.app/Contents"
          set +e
          /usr/bin/perl "$app/Resources/mediaremote-adapter.pl" \
            "$app/Frameworks/MediaRemoteAdapter.framework" \
            "$app/Helpers/MediaRemoteAdapterTestClient" test
          code=$?
          set -e
          echo "Adapter-Test exit code: $code (0 = funktionsfähig; auf CI-Runnern ohne Medien oft != 0)"
          echo "Adapter-Test (${{ matrix.os }}): Exit-Code $code" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        if: matrix.os == env.RELEASE_RUNNER
        uses: actions/upload-artifact@v4
        with:
          name: MusicDesk
          path: dist/MusicDesk-*.zip
          if-no-files-found: error

      - name: Release name
        if: matrix.os == env.RELEASE_RUNNER && (startsWith(github.ref, 'refs/tags/v') || inputs.release)
        id: rel
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=MusicDesk $tag" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: matrix.os == env.RELEASE_RUNNER && (startsWith(github.ref, 'refs/tags/v') || inputs.release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.rel.outputs.name }}
          files: dist/MusicDesk-*.zip
